
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino's Pizza | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">Domino's Pizza</a>

    <nav>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a class="active" href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main class="login-page">

    <!-- LEFT SIDE: ONLY IMAGE -->
    <div class="login-image">
        <img
            src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=900&q=80"
            alt="Delicious Pizza">
    </div>

    <!-- RIGHT SIDE: LOGIN INFORMATION -->
    <div class="login-box">

        <h1>Login</h1>
        <p class="login-subtitle">
            Welcome to Domino's Pizza
        </p>

        <form action="#" method="post">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

            <div class="remember">
                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn login-btn">
                Login
            </button>

        </form>

        <p class="back-home">
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

</main>

<footer class="footer">
    <h3>Domino's Pizza</h3>
    <p>Fresh Taste. Happy Moments.</p>
    <p> Domino's Pizza Website.</p>
</footer>

</body>
</html>
